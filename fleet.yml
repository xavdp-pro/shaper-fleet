# fleet.yml — the map of everything, at pinned versions.
# Schema and laws: SHAPER-OS-V1.13/docs/architecture/FLEET.md (Rule 37).
# Repos and tags only — instances are ledger rows, buckets are derivable.
base:
  repo: https://github.com/xavdp-pro/SHAPER-OS-V1.13
  tag: v1.13.41
catalogue:
  repo: https://github.com/xavdp-pro/SHAPER-OS-BRICKS-V1.13
  tag: v1.13.1
# Registering a class is a manual PR today (shaper new will automate it —
# TARGET). A class is a repo and a tag. An INSTANCE of a class is never listed
# here: instances are rows in the ledger of whichever universe governs them.
# `tag: unreleased` means the intent is written and the code is being built.
classes:
  # The demo fractal. Instances are ledger rows in univ-demo-saas, never repos.
  - name: univ-demo-saas
    repo: https://github.com/xavdp-pro/univ-demo-saas
    tag: unreleased          # the intent is written; the code is being assembled
    governedBy: self         # it is itself a governor
  - name: univ-demo-crm
    repo: https://github.com/xavdp-pro/univ-demo-crm
    tag: unreleased
    governedBy: univ-demo-saas
machines:
  - name: gbs-test
    kind: lxd
    registry: 10.213.199.234:5000   # reachable FROM INSIDE a universe LXC, which is
                                    # where builds run (Rule 11). A host-relative
                                    # 127.0.0.1 names the LXC itself and the push dies.
    reach: operator SSH, IP-allowlisted — credentials never live here
  - name: gbs-p2
    kind: proxmox
    registry: <ask the operator>    # gbs-p2 runs its own registry — one per machine.
                                    # Record the LXC-reachable address, never 127.0.0.1.
    reach: operator SSH, IP-allowlisted — credentials never live here
