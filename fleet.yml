# fleet.yml — the map of everything, at pinned versions.
# Schema and laws: SHAPER-OS-V1.13/docs/architecture/FLEET.md (Rule 37).
# Repos and tags only — instances are ledger rows, buckets are derivable.
base:
  repo: https://github.com/xavdp-pro/SHAPER-OS-V1.13
  tag: v1.13.1
catalogue:
  repo: https://github.com/xavdp-pro/SHAPER-OS-BRICKS-V1.13
  tag: v1.13.1
# No class registered yet. Registration is a manual PR today (shaper new will
# automate it — TARGET). To register the first class, DELETE the `classes: []`
# line below and uncomment this block as-is:
# classes:
#   - name: univ-<projet>-<classe>
#     repo: https://github.com/xavdp-pro/univ-<projet>-<classe>
#     tag: v1.0.0
#     governedBy: self
classes: []
machines:
  - name: gbs-test
    kind: lxd
    registry: 127.0.0.1:5000        # the shaper-registry container on this host
    reach: operator SSH, IP-allowlisted — credentials never live here
  - name: gbs-p2
    kind: proxmox
    registry: 127.0.0.1:5000        # gbs-p2 runs its own registry — one per machine
    reach: operator SSH, IP-allowlisted — credentials never live here
